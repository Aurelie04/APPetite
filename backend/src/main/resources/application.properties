spring.application.name=appetite-backend
server.port=8080

# MySQL - database "react_demo" is created automatically if missing
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/react_demo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT - Base64 key of at least 32 bytes. If unset, a random key is generated at startup
# (sessions are then invalidated whenever the backend restarts).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=1440

# Frontend / CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Password reset
app.password-reset.expiration-minutes=30
# No mail server is configured yet: when true, the reset link is returned by the API and logged.
app.password-reset.expose-link=${EXPOSE_RESET_LINK:true}
